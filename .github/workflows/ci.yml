name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: pipx install conan
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('conanfile.py') }}
      - name: Configure
        run: ./scripts/configure.sh ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testing-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install conan
      - run: ./scripts/test.sh asan
      - run: ./scripts/test.sh ubsan
